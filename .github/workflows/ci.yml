name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/flowpilot_ai_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flowpilot_ai_test
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format
      - run: npm run test:db:migrate
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format
      - run: npm run test
      - run: npm run build
